<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glim — Safety Monitor</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #090a0f;
        color: #eef1f7;
        padding: 24px;
      }
      header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
      h1 { font-size: 18px; margin: 0; font-weight: 650; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 10px #3ddc84; }
      .dot.stale { background: #6b7280; box-shadow: none; }
      .sub { color: #9aa3b2; font-size: 13px; margin: 0 0 20px; }
      .empty { color: #6b7280; padding: 40px; text-align: center; border: 1px dashed #232733; border-radius: 14px; }
      .card {
        background: #11141c;
        border: 1px solid #1c2130;
        border-left: 4px solid #ff4d5e;
        border-radius: 14px;
        padding: 16px 18px;
        margin-bottom: 12px;
        animation: pop .25s ease;
      }
      @keyframes pop { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
      .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
      .word { font-size: 20px; font-weight: 700; color: #ff8a93; }
      .time { color: #9aa3b2; font-size: 12px; white-space: nowrap; }
      .meta { color: #9aa3b2; font-size: 13px; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 14px; }
      .meta b { color: #cdd4e0; font-weight: 600; }
      code { font-family: ui-monospace, monospace; color: #cdd4e0; }
    </style>
  </head>
  <body>
    <header><span id="status" class="dot"></span><h1>Glim — Safety Monitor</h1></header>
    <p class="sub">Live feed of <code>trigger_safety_flag</code> events from the Vapi call. Polls every 2s.</p>
    <div id="list"><div class="empty">Waiting for a safe-word flag…</div></div>

    <script>
      const list = document.getElementById("list");
      const status = document.getElementById("status");

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])
        );
      }

      function render(incidents) {
        if (!incidents.length) {
          list.innerHTML = '<div class="empty">Waiting for a safe-word flag…</div>';
          return;
        }
        list.innerHTML = incidents
          .map((i) => `
            <div class="card">
              <div class="top">
                <span class="word">🚨 "${esc(i.safeWordHeard) || "(safe word)"}"</span>
                <span class="time">${esc(new Date(i.at).toLocaleTimeString())}</span>
              </div>
              <div class="meta">
                <span>user <b>${esc(i.userId)}</b></span>
                <span>call <b>${esc(i.callId) || "—"}</b></span>
                <span>via <b>${esc(i.source)}</b></span>
                ${i.incidentId ? `<span>incident <b>${esc(i.incidentId)}</b></span>` : ""}
              </div>
            </div>`)
          .join("");
      }

      async function tick() {
        try {
          const res = await fetch("/api/incidents");
          const data = await res.json();
          status.classList.remove("stale");
          render(data.incidents || []);
        } catch {
          status.classList.add("stale");
        }
      }

      tick();
      setInterval(tick, 2000);
    </script>
  </body>
</html>
